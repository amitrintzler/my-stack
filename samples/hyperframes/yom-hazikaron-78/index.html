<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Hebrew"; font-weight: 300; src: url("./vendor/noto-hebrew-300.woff2") format("woff2"); }
      @font-face { font-family: "Noto Hebrew"; font-weight: 400; src: url("./vendor/noto-hebrew-400.woff2") format("woff2"); }
      @font-face { font-family: "Noto Hebrew"; font-weight: 600; src: url("./vendor/noto-hebrew-600.woff2") format("woff2"); }
      @font-face { font-family: "Noto Hebrew"; font-weight: 800; src: url("./vendor/noto-hebrew-800.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #000;
        font-family: "Noto Hebrew", -apple-system, sans-serif;
        direction: rtl;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      #root { position: relative; width: 100%; height: 100%; }

      .scene {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column;
      }

      /* === SCENE 1: שקט === */
      #s1 {
        background: radial-gradient(ellipse at center, #0e0a05 0%, #000 80%);
      }
      .candle-wrap {
        position: relative;
        width: 80px; height: 220px;
        margin-bottom: 50px;
      }
      .candle-body {
        position: absolute;
        bottom: 0; left: 50%;
        width: 36px; height: 150px;
        background: linear-gradient(180deg, #1c1c1c 0%, #0a0a0a 100%);
        border-radius: 4px 4px 2px 2px;
        box-shadow: 0 2px 16px rgba(0,0,0,0.5);
      }
      .candle-wick {
        position: absolute;
        bottom: 150px; left: 50%;
        width: 2px; height: 8px;
        background: #1a1a1a;
      }
      .candle-flame {
        position: absolute;
        bottom: 152px; left: 50%;
        width: 22px; height: 42px;
        background: radial-gradient(ellipse at 50% 85%, #fff5a8 0%, #ffb347 35%, #ff6a00 70%, transparent 100%);
        border-radius: 50% 50% 30% 30% / 70% 70% 30% 30%;
        filter: blur(0.5px);
        opacity: 0;
        box-shadow:
          0 0 30px 10px rgba(255, 170, 60, 0.35),
          0 0 60px 20px rgba(255, 120, 30, 0.22);
        animation: flicker 1.8s ease-in-out infinite alternate;
      }
      @keyframes flicker {
        0%   { transform: scaleY(1)    scaleX(1)    translateY(0); }
        25%  { transform: scaleY(1.06) scaleX(0.96) translateY(-0.5px); }
        60%  { transform: scaleY(0.95) scaleX(1.03) translateY(0.5px); }
        100% { transform: scaleY(1.03) scaleX(0.99) translateY(0); }
      }
      .s1-title {
        font-size: 78px;
        font-weight: 300;
        letter-spacing: 8px;
        color: #e8dcc0;
      }
      .stars-1 { position: absolute; inset: 0; pointer-events: none; }
      .star {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        opacity: 0;
      }

      /* === SCENE 2: שיר הרעות === */
      #s2 {
        background: radial-gradient(ellipse at center, #0a0805 0%, #000 75%);
      }
      .candle-sm {
        position: absolute;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        width: 14px;
        height: 26px;
        background: radial-gradient(ellipse at 50% 85%, #fff5a8 0%, #ffb347 40%, #ff6a00 75%, transparent 100%);
        border-radius: 50% 50% 30% 30% / 70% 70% 30% 30%;
        filter: blur(0.3px);
        box-shadow:
          0 0 20px 6px rgba(255, 170, 60, 0.35),
          0 0 40px 14px rgba(255, 120, 30, 0.2);
        animation: flicker 2.2s ease-in-out infinite alternate;
      }
      .silhouettes {
        position: absolute;
        bottom: 0;
        left: 0; right: 0;
        height: 400px;
        pointer-events: none;
        opacity: 0.25;
      }
      .silhouette {
        position: absolute;
        bottom: 0;
        width: 80px;
        height: 280px;
        background: linear-gradient(180deg, transparent 0%, #3a2f1a 70%, #1a1209 100%);
        border-radius: 40px 40px 0 0;
        filter: blur(2px);
        opacity: 0;
      }
      .poem {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        max-width: 1400px;
        text-align: center;
        position: relative;
        z-index: 2;
      }
      .poem-line {
        font-size: 62px;
        font-weight: 300;
        color: #e8dcc0;
        letter-spacing: 3px;
        line-height: 1.5;
        direction: rtl;
      }
      .poem-word {
        display: inline-block;
        opacity: 0;
        margin-left: 0.35em;
      }
      .poem-line.accent .poem-word {
        color: #f4d798;
        font-weight: 400;
      }

      /* === SCENE 3: הצפירה === */
      #s3 {
        background: #000;
      }
      .siren-wrap {
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 120px;
      }
      .sine-wave {
        width: 1400px;
        height: 160px;
        position: relative;
        opacity: 0;
      }
      .sine-wave svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .sine-wave path {
        fill: none;
        stroke: #fff;
        stroke-width: 2;
        stroke-linecap: round;
        filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
      }
      .siren-label {
        font-size: 24px;
        font-weight: 300;
        letter-spacing: 10px;
        color: #888;
        text-transform: uppercase;
        opacity: 0;
        direction: ltr;
      }

      /* === SCENE 4: השנייה === */
      #s4 {
        background: #000;
        overflow: hidden;
      }
      .burst-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 10px;
        height: 10px;
        background: #fff;
        border-radius: 50%;
        opacity: 0;
        box-shadow: 0 0 0 rgba(255, 255, 255, 0);
      }
      .burst-spark {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 4px;
        height: 4px;
        background: #ffd966;
        border-radius: 50%;
        opacity: 0;
        box-shadow: 0 0 8px #ffd966;
      }

      /* === SCENE 5: חגיגה === */
      #s5 {
        background:
          radial-gradient(ellipse at 50% 30%, rgba(30, 64, 140, 0.4) 0%, transparent 60%),
          radial-gradient(ellipse at center 100%, #1a3a80 0%, #0a1d4a 40%, #050c26 80%, #000 100%);
        overflow: hidden;
      }
      .s5-rays {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 2000px;
        height: 800px;
        background:
          conic-gradient(from 180deg at 50% 100%,
            transparent 0deg,
            rgba(255, 230, 150, 0.05) 5deg,
            transparent 10deg,
            rgba(255, 230, 150, 0.08) 15deg,
            transparent 20deg,
            rgba(255, 230, 150, 0.05) 30deg,
            transparent 40deg,
            rgba(255, 230, 150, 0.07) 50deg,
            transparent 60deg,
            transparent 300deg,
            rgba(255, 230, 150, 0.07) 310deg,
            transparent 320deg,
            rgba(255, 230, 150, 0.05) 330deg,
            transparent 340deg,
            rgba(255, 230, 150, 0.08) 345deg,
            transparent 355deg,
            transparent 360deg);
        opacity: 0;
        pointer-events: none;
      }
      .flag-stage {
        position: absolute;
        top: 44%;
        left: 50%;
        width: 900px;
        height: 620px;
        margin-left: -450px;
        margin-top: -310px;
        opacity: 0;
        perspective: 1800px;
      }
      .flag {
        position: relative;
        width: 100%;
        height: 100%;
        background: #fff;
        box-shadow:
          0 20px 80px rgba(0, 56, 184, 0.45),
          0 4px 30px rgba(0, 0, 0, 0.4);
        transform-origin: left center;
        /* subtle waving shadow effect via background */
        background:
          linear-gradient(90deg,
            rgba(0, 0, 0, 0.04) 0%,
            transparent 15%,
            rgba(255, 255, 255, 0) 45%,
            rgba(0, 0, 0, 0.03) 65%,
            transparent 85%,
            rgba(0, 0, 0, 0.05) 100%),
          #fff;
      }
      .flag-stripe {
        position: absolute;
        left: 0;
        right: 0;
        height: 14.3%;
        background: #0038B8;
      }
      .flag-stripe.top { top: 14.3%; }
      .flag-stripe.bot { bottom: 14.3%; }
      .flag-star {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 260px;
        height: 260px;
        margin-top: -130px;
        margin-left: -130px;
        z-index: 5;
      }
      .flag-star svg { width: 100%; height: 100%; }
      .firework {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }
      .firework-trail {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }
      .s5-caption {
        position: absolute;
        bottom: 90px;
        left: 0; right: 0;
        text-align: center;
        font-size: 68px;
        font-weight: 400;
        letter-spacing: 8px;
        color: #fff;
        opacity: 0;
        text-shadow: 0 2px 30px rgba(255, 255, 255, 0.3),
                     0 4px 60px rgba(100, 160, 255, 0.25);
      }
      .s5-caption-sub {
        position: absolute;
        bottom: 54px;
        left: 0; right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: 300;
        letter-spacing: 14px;
        color: #9fc5ff;
        opacity: 0;
        direction: ltr;
        text-transform: uppercase;
      }

      /* === SCENE 6: המסר === */
      #s6 {
        background:
          radial-gradient(ellipse at 50% 40%, rgba(20, 40, 90, 0.6) 0%, #050a1e 50%, #000 100%);
      }
      .s6-stars { position: absolute; inset: 0; pointer-events: none; }
      .s6-star {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        opacity: 0;
      }
      .s6-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 2;
      }
      .s6-primary {
        font-size: 120px;
        font-weight: 600;
        color: #fff;
        letter-spacing: 4px;
        text-align: center;
        line-height: 1.2;
        opacity: 0;
        text-shadow: 0 2px 40px rgba(255, 255, 255, 0.2),
                     0 4px 80px rgba(100, 160, 255, 0.15);
      }
      .s6-divider {
        width: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, #f4d798 50%, transparent);
        margin: 50px 0;
      }
      .s6-secondary {
        font-size: 42px;
        font-weight: 300;
        letter-spacing: 14px;
        color: #f4e6b8;
        opacity: 0;
      }
      .s6-candle {
        position: absolute;
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
        width: 14px;
        height: 26px;
        background: radial-gradient(ellipse at 50% 85%, #fff5a8 0%, #ffb347 40%, #ff6a00 75%, transparent 100%);
        border-radius: 50% 50% 30% 30% / 70% 70% 30% 30%;
        opacity: 0;
        box-shadow:
          0 0 24px 8px rgba(255, 170, 60, 0.4),
          0 0 50px 16px rgba(255, 120, 30, 0.25);
        animation: flicker 2.2s ease-in-out infinite alternate;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="50"
      data-width="1920"
      data-height="1080"
    >
      <!-- SCENE 1: שקט (0-7s) -->
      <div id="s1" class="scene clip" data-start="0" data-duration="7.5" data-track-index="1">
        <div class="stars-1" id="stars"></div>
        <div class="candle-wrap">
          <div class="candle-body"></div>
          <div class="candle-wick"></div>
          <div class="candle-flame"></div>
        </div>
        <div class="s1-title">יום הזיכרון</div>
      </div>

      <!-- SCENE 2: שיר הרעות (7-20s) -->
      <div id="s2" class="scene clip" data-start="7" data-duration="13.5" data-track-index="2">
        <div class="candle-sm"></div>
        <div class="silhouettes" id="silhouettes"></div>
        <div class="poem">
          <div class="poem-line" id="line1">
            <span class="poem-word">אך</span>
            <span class="poem-word">נזכור</span>
            <span class="poem-word">את</span>
            <span class="poem-word">כולם</span>
          </div>
          <div class="poem-line" id="line2">
            <span class="poem-word">את</span>
            <span class="poem-word">יפי</span>
            <span class="poem-word">הבלורית</span>
            <span class="poem-word">והתואר</span>
          </div>
          <div class="poem-line accent" id="line3">
            <span class="poem-word">כי</span>
            <span class="poem-word">רעות</span>
            <span class="poem-word">שכזאת</span>
            <span class="poem-word">לעולם</span>
          </div>
          <div class="poem-line accent" id="line4">
            <span class="poem-word">לא</span>
            <span class="poem-word">תתן</span>
            <span class="poem-word">את</span>
            <span class="poem-word">ליבנו</span>
            <span class="poem-word">לשכוח</span>
          </div>
        </div>
      </div>

      <!-- SCENE 3: הצפירה (20-28s) -->
      <div id="s3" class="scene clip" data-start="20" data-duration="8.5" data-track-index="3">
        <div class="siren-wrap">
          <div class="sine-wave">
            <svg viewBox="0 0 1400 160" preserveAspectRatio="none">
              <path id="sine-path"
                d="M 0 80 Q 50 80 50 80 T 100 80 T 150 80 T 200 80 T 250 80 T 300 80 T 350 80 T 400 80 T 450 80 T 500 80 T 550 80 T 600 80 T 650 80 T 700 80 T 750 80 T 800 80 T 850 80 T 900 80 T 950 80 T 1000 80 T 1050 80 T 1100 80 T 1150 80 T 1200 80 T 1250 80 T 1300 80 T 1350 80 T 1400 80"/>
            </svg>
          </div>
          <div class="siren-label">11:00 · כל הארץ עומדת</div>
        </div>
      </div>

      <!-- SCENE 4: השנייה (28-30s) -->
      <div id="s4" class="scene clip" data-start="28" data-duration="2.5" data-track-index="4">
        <div class="burst-center" id="burst-center"></div>
        <div id="burst-container"></div>
      </div>

      <!-- SCENE 5: חגיגה (30-42s) -->
      <div id="s5" class="scene clip" data-start="30" data-duration="12.5" data-track-index="5">
        <div class="s5-rays"></div>
        <div id="fireworks-container"></div>
        <div class="flag-stage">
          <div class="flag">
            <div class="flag-stripe top"></div>
            <div class="flag-stripe bot"></div>
            <div class="flag-star">
              <svg viewBox="0 0 200 200">
                <polygon points="100,15 175,150 25,150"
                  fill="none" stroke="#0038B8" stroke-width="10" stroke-linejoin="miter"/>
                <polygon points="100,185 25,50 175,50"
                  fill="none" stroke="#0038B8" stroke-width="10" stroke-linejoin="miter"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="s5-caption">יום העצמאות ה-78</div>
        <div class="s5-caption-sub">Independence Day · 2026</div>
      </div>

      <!-- SCENE 6: המסר (42-50s) -->
      <div id="s6" class="scene clip" data-start="42" data-duration="8" data-track-index="6">
        <div class="s6-stars" id="s6-stars"></div>
        <div class="s6-wrap">
          <div class="s6-primary">אנחנו חוגגים בזכותם</div>
          <div class="s6-divider"></div>
          <div class="s6-secondary">עם ישראל חי</div>
        </div>
        <div class="s6-candle"></div>
      </div>
    </div>

    <script>
      // Deterministic PRNG (mulberry32)
      function mulberry32(seed) {
        return function() {
          let t = seed += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(19480514);

      // --- Scene 1: Stars ---
      const starsContainer = document.getElementById('stars');
      const starPoints = [
        [8, 22], [18, 35], [32, 18], [45, 30], [58, 15], [72, 32], [85, 20], [92, 40],
        [12, 58], [26, 70], [40, 65], [55, 78], [68, 62], [82, 72],
        [10, 88], [28, 92], [48, 85], [62, 94], [78, 88], [90, 92]
      ];
      starPoints.forEach(([x, y]) => {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = x + '%';
        s.style.top = y + '%';
        const size = 1.5 + rand() * 1.8;
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.dataset.opacity = (0.2 + rand() * 0.45).toFixed(2);
        starsContainer.appendChild(s);
      });

      // --- Scene 2: Silhouettes ---
      const silhouettesContainer = document.getElementById('silhouettes');
      const silhouettePositions = [8, 20, 32, 45, 56, 68, 80, 90];
      silhouettePositions.forEach((x, i) => {
        const el = document.createElement('div');
        el.className = 'silhouette';
        el.style.left = x + '%';
        const h = 240 + rand() * 80;
        const w = 60 + rand() * 30;
        el.style.height = h + 'px';
        el.style.width = w + 'px';
        silhouettesContainer.appendChild(el);
      });

      // --- Scene 4: Sparks for burst ---
      const burstContainer = document.getElementById('burst-container');
      for (let i = 0; i < 48; i++) {
        const sp = document.createElement('div');
        sp.className = 'burst-spark';
        const angle = (i / 48) * Math.PI * 2;
        sp.dataset.angle = angle;
        sp.dataset.distance = (350 + rand() * 300).toFixed(0);
        sp.dataset.hue = [45, 55, 40, 50][i % 4]; // warm golds
        burstContainer.appendChild(sp);
      }

      // --- Scene 5: Fireworks (bigger, richer) ---
      const fwContainer = document.getElementById('fireworks-container');
      const fireworkBursts = [
        { cx: 18, cy: 22, delay: 30.3, color: '#ffd966', size: 'lg' },
        { cx: 78, cy: 18, delay: 30.9, color: '#9fc5ff', size: 'lg' },
        { cx: 42, cy: 12, delay: 32.0, color: '#fff',    size: 'md' },
        { cx: 62, cy: 32, delay: 32.8, color: '#ffb347', size: 'md' },
        { cx: 12, cy: 38, delay: 33.6, color: '#9fc5ff', size: 'lg' },
        { cx: 85, cy: 40, delay: 34.4, color: '#ffd966', size: 'md' },
        { cx: 30, cy: 20, delay: 35.6, color: '#fff',    size: 'lg' },
        { cx: 70, cy: 28, delay: 36.4, color: '#ffb347', size: 'md' },
        { cx: 50, cy: 16, delay: 37.4, color: '#ffd966', size: 'lg' },
        { cx: 22, cy: 32, delay: 38.2, color: '#9fc5ff', size: 'md' },
      ];
      fireworkBursts.forEach((b) => {
        const particleCount = b.size === 'lg' ? 32 : 22;
        const distanceBase = b.size === 'lg' ? 160 : 110;
        for (let i = 0; i < particleCount; i++) {
          const f = document.createElement('div');
          f.className = 'firework';
          f.style.left = b.cx + '%';
          f.style.top = b.cy + '%';
          f.style.background = b.color;
          f.style.boxShadow = `0 0 12px ${b.color}, 0 0 20px ${b.color}`;
          const angle = (i / particleCount) * Math.PI * 2 + rand() * 0.15;
          f.dataset.angle = angle;
          f.dataset.distance = (distanceBase + rand() * 100).toFixed(0);
          f.dataset.delay = b.delay;
          fwContainer.appendChild(f);
        }
        // trail — rising streak before the burst
        const trail = document.createElement('div');
        trail.className = 'firework-trail';
        trail.style.left = b.cx + '%';
        trail.style.top = (b.cy + 40) + '%';
        trail.style.background = b.color;
        trail.style.boxShadow = `0 0 6px ${b.color}`;
        trail.dataset.targetTop = b.cy + '%';
        trail.dataset.delay = (b.delay - 0.4).toFixed(2);
        fwContainer.appendChild(trail);
      });

      // --- Scene 6: stars ---
      const s6Stars = document.getElementById('s6-stars');
      const s6StarPoints = [
        [10, 15], [22, 25], [35, 12], [58, 20], [72, 18], [88, 24],
        [15, 80], [32, 85], [50, 88], [68, 82], [85, 86],
        [8, 45], [92, 48]
      ];
      s6StarPoints.forEach(([x, y]) => {
        const s = document.createElement('div');
        s.className = 's6-star';
        s.style.left = x + '%';
        s.style.top = y + '%';
        const sz = 1.5 + rand() * 2;
        s.style.width = sz + 'px';
        s.style.height = sz + 'px';
        s.dataset.opacity = (0.15 + rand() * 0.4).toFixed(2);
        s6Stars.appendChild(s);
      });

      // === TIMELINE ===
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // SCENE 1 — שקט
      tl.to('.star', {
        opacity: (i, el) => parseFloat(el.dataset.opacity),
        duration: 2.0,
        stagger: 0.05,
        ease: 'power1.inOut'
      }, 0.2);
      tl.to('.candle-flame', {
        opacity: 1,
        duration: 1.2,
        ease: 'power2.out'
      }, 1.8);
      tl.from('.candle-wrap', {
        y: 10,
        opacity: 0,
        duration: 1.5,
        ease: 'power2.out'
      }, 1.5);
      tl.from('.s1-title', {
        opacity: 0,
        y: 20,
        duration: 2.0,
        ease: 'power2.out'
      }, 4.0);

      // SCENE 2 — שיר הרעות
      tl.to('.silhouette', {
        opacity: (i) => 0.4 + (i % 3) * 0.1,
        duration: 2.5,
        stagger: 0.12,
        ease: 'power1.inOut'
      }, 7.2);

      // Poem reveal — word by word, slow breath cadence
      const lineStartTimes = [8.0, 10.2, 12.8, 15.4];
      ['#line1', '#line2', '#line3', '#line4'].forEach((sel, lineIdx) => {
        tl.to(`${sel} .poem-word`, {
          opacity: 1,
          duration: 0.6,
          stagger: 0.32,
          ease: 'power1.out'
        }, lineStartTimes[lineIdx]);
      });

      // Hold the poem visible, then gentle fade of silhouettes only
      tl.to('.silhouette', {
        opacity: 0,
        duration: 1.5
      }, 19.2);

      // SCENE 3 — הצפירה
      // Animate sine wave path amplitude via morph
      tl.fromTo('.sine-wave', {
        opacity: 0,
        scaleY: 0.2
      }, {
        opacity: 1,
        scaleY: 1,
        duration: 1.5,
        ease: 'power2.out'
      }, 20.3);

      // Animated sine wave — oscillate vertical center by animating path's d
      const sinePath = document.getElementById('sine-path');
      const sineObj = { phase: 0, amp: 0 };
      function rebuildSine() {
        const pts = [];
        const segments = 28;
        const w = 1400;
        for (let i = 0; i <= segments; i++) {
          const x = (i / segments) * w;
          const y = 80 + Math.sin((i / segments) * Math.PI * 8 + sineObj.phase) * sineObj.amp;
          pts.push(`${x} ${y}`);
        }
        sinePath.setAttribute('d', 'M ' + pts.join(' L '));
      }
      tl.to(sineObj, {
        amp: 40,
        duration: 1.2,
        ease: 'power2.out',
        onUpdate: rebuildSine
      }, 20.5);
      tl.to(sineObj, {
        phase: Math.PI * 6,
        duration: 5.0,
        ease: 'none',
        onUpdate: rebuildSine
      }, 21.7);
      tl.to(sineObj, {
        amp: 0,
        duration: 0.8,
        ease: 'power2.in',
        onUpdate: rebuildSine
      }, 26.7);

      tl.to('.siren-label', {
        opacity: 1,
        duration: 1.2,
        ease: 'power1.out'
      }, 22.0);
      tl.to('.siren-label', {
        opacity: 0,
        duration: 0.8
      }, 27.2);

      // SCENE 4 — השנייה (the cut)
      // Sudden white pulse then sparks fly outward
      tl.fromTo('.burst-center',
        { opacity: 0, scale: 1 },
        { opacity: 1, scale: 8, duration: 0.2, ease: 'power4.out' },
        28.0
      );
      tl.to('.burst-center', {
        opacity: 0,
        duration: 0.3
      }, 28.2);

      gsap.utils.toArray('.burst-spark').forEach((el) => {
        const angle = parseFloat(el.dataset.angle);
        const distance = parseFloat(el.dataset.distance);
        tl.fromTo(el,
          { opacity: 0, x: 0, y: 0 },
          { opacity: 1, duration: 0.1 },
          28.1
        );
        tl.to(el, {
          x: Math.cos(angle) * distance,
          y: Math.sin(angle) * distance,
          duration: 1.4,
          ease: 'power2.out'
        }, 28.1);
        tl.to(el, {
          opacity: 0,
          duration: 0.5
        }, 29.6);
      });

      // SCENE 5 — חגיגה
      // Rays of light wash up from below
      tl.fromTo('.s5-rays',
        { opacity: 0 },
        { opacity: 1, duration: 2.5, ease: 'power2.out' },
        30.2
      );

      // Flag emerges, scales up gently
      tl.fromTo('.flag-stage',
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 2.0, ease: 'power2.out' },
        30.4
      );

      // Subtle whole-flag wave — rotate Y back/forth gently
      tl.fromTo('.flag',
        { rotationY: -6 },
        {
          rotationY: 6,
          duration: 4.0,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: 2
        },
        31.0
      );

      // Firework trails — rise toward burst point
      gsap.utils.toArray('.firework-trail').forEach((el) => {
        const delay = parseFloat(el.dataset.delay);
        const targetTop = el.dataset.targetTop;
        tl.fromTo(el,
          { opacity: 0, top: el.style.top },
          { opacity: 0.8, duration: 0.1 },
          delay
        );
        tl.to(el, {
          top: targetTop,
          duration: 0.4,
          ease: 'power2.out'
        }, delay);
        tl.to(el, { opacity: 0, duration: 0.15 }, delay + 0.4);
      });

      // Firework bursts — expand then fade with trail
      gsap.utils.toArray('.firework').forEach((el) => {
        const angle = parseFloat(el.dataset.angle);
        const distance = parseFloat(el.dataset.distance);
        const delay = parseFloat(el.dataset.delay);
        tl.fromTo(el,
          { opacity: 0, x: 0, y: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.2 },
          delay
        );
        tl.to(el, {
          x: Math.cos(angle) * distance,
          y: Math.sin(angle) * distance,
          duration: 1.8,
          ease: 'power2.out'
        }, delay);
        tl.to(el, {
          opacity: 0,
          y: `+=${40 + rand() * 30}`,
          duration: 1.1
        }, delay + 1.2);
      });

      // Caption — appears mid-celebration with soft rise
      tl.fromTo('.s5-caption',
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 1.8, ease: 'power2.out' },
        36.5
      );
      tl.fromTo('.s5-caption-sub',
        { opacity: 0 },
        { opacity: 1, duration: 1.4, ease: 'power2.out' },
        37.8
      );

      // SCENE 6 — המסר (clean, no flag competing with text)
      tl.to('.s6-star', {
        opacity: (i, el) => parseFloat(el.dataset.opacity),
        duration: 2.0,
        stagger: 0.04,
        ease: 'power1.inOut'
      }, 42.2);
      tl.fromTo('.s6-primary',
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 2.2, ease: 'power2.out' },
        42.6
      );
      tl.to('.s6-divider', {
        width: 540,
        duration: 1.8,
        ease: 'power2.out'
      }, 44.6);
      tl.fromTo('.s6-secondary',
        { opacity: 0 },
        { opacity: 1, duration: 2.0, ease: 'power2.out' },
        45.6
      );
      tl.fromTo('.s6-candle',
        { opacity: 0 },
        { opacity: 1, duration: 1.8, ease: 'power2.out' },
        46.8
      );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
