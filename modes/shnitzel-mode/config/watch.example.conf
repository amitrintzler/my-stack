# shnitzel-mode watch configuration. Copy to ~/.agents/watch.conf and edit.
# Shell-sourced, so no yaml parser and no extra dependency.

# Repositories watched explicitly, space separated, owner/name form.
REPOS=""

# Organisations whose open PRs involving you are watched. Used for review
# requests and mentions, which are queried globally rather than per repo.
OWNERS=""

# The default branch name to treat as production truth. Per repo overrides
# go in DEFAULT_BRANCH_<owner>_<repo> with dashes and dots replaced by
# underscores, for example DEFAULT_BRANCH_acme_web_api="master".
DEFAULT_BRANCH="main"

# A pull request of yours with no activity for this many days is called stale.
STALE_DAYS=5

# A review requested from you and untouched for this many days is escalated.
REVIEW_SLA_DAYS=2

# Set to 0 to skip Dependabot and code scanning queries, which 403 on repos
# where the feature is off and cost one API call each.
CHECK_SECURITY=1

# Where the dedupe state lives. Delete this file to get a full report again.
STATE_FILE="$HOME/.agents/watch-state.json"

# Local checkouts scanned for feature ledgers at docs/features/*/feature.yml.
# Space separated directories. Leave empty to skip the feature scan entirely.
PROJECT_ROOTS=""

# Days a feature may sit in each stage before it is called stalled.
STAGE_DAYS_idea=3
STAGE_DAYS_prd=5
STAGE_DAYS_hld=7
STAGE_DAYS_plan=5
STAGE_DAYS_build=21
STAGE_DAYS_shipped=5

# Platforms probed by bin/domain-scan.sh, space separated. Leave empty to probe
# every one whose CLI is present and configured. Each probe is read only and is
# skipped silently when its tool is missing. Run domain-scan.sh --list to see
# which would run and why the others would not.
#   argocd kubernetes openshift helm vault observability jenkins nexus artifactory
DOMAINS=""

# Guard against probing the wrong cluster. When set, the kubernetes probe runs
# only if kubectl's current context matches. Leave empty to probe whatever is
# current, which is fine on a laptop and a bad idea on a shared runner.
KUBE_CONTEXT=""

# Endpoints for probes that have no local CLI. Credentials come from ~/.netrc,
# never from this file.
PROM_URL=""
JENKINS_URL=""
NEXUS_URL=""
ARTIFACTORY_URL=""

# Clouds are not polled. Cost, IAM and quota questions are answered on a cadence
# by the cost-review and access-review skills, not every hour.
