name: check

on:
  push:
    branches-ignore: []
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Publish check
        run: bash bin/publish-check.sh

      - name: Collectors run with no config
        run: |
          # With no repositories configured every collector must exit cleanly
          # and emit valid JSON rather than failing. A watch that dies silently
          # on a fresh machine is worse than no watch.
          set -e
          echo 'PROJECT_ROOTS=""' > /tmp/empty.conf
          bash bin/feature-scan.sh --config /tmp/empty.conf | jq -e 'type == "array"' > /dev/null
          bash bin/scope-check.sh  --config /tmp/empty.conf | jq -e 'type == "array"' > /dev/null
          bash bin/domain-scan.sh  --config /tmp/empty.conf | jq -e 'type == "array"' > /dev/null
          bash bin/domain-scan.sh  --config /tmp/empty.conf --list > /dev/null
          echo "collectors ok"

      - name: Installer dry run makes no changes
        run: |
          set -e
          mkdir -p "$HOME/.codex" && touch "$HOME/.codex/config.toml"
          before="$(find "$HOME/.agents" -type f 2>/dev/null | wc -l)"
          bash install.sh codex > /dev/null
          after="$(find "$HOME/.agents" -type f 2>/dev/null | wc -l)"
          [ "$before" = "$after" ] || { echo "dry run wrote files"; exit 1; }
          echo "dry run clean"
